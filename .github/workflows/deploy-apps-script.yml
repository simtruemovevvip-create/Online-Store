name: Sync and deploy Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - "Code.gs"
      - "Index.html"
      - ".clasp.json"
      - ".github/workflows/deploy-apps-script.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve deployment target and check credentials
        id: config
        shell: bash
        run: |
          DEPLOY_ID="$GAS_DEPLOYMENT_ID"
          if [[ -z "$DEPLOY_ID" ]]; then
            DEPLOY_ID="$(node <<'NODE'
          const fs = require("fs");
          const source = fs.readFileSync("Code.gs", "utf8");
          const prefix = "https://script.google.com/macros/s/";
          const start = source.indexOf(prefix);
          const deploymentId = start >= 0 ? source.slice(start + prefix.length).split("/")[0] : "";
          if (deploymentId) process.stdout.write(deploymentId);
          NODE
          )"
          fi

          if [[ -n "$DEPLOY_ID" ]]; then
            echo "GAS_DEPLOYMENT_ID=$DEPLOY_ID" >> "$GITHUB_ENV"
            echo "Deployment target resolved."
          else
            echo "::error::Could not find a Web App deployment ID. Define the GAS_DEPLOYMENT_ID Actions variable or check WEB_APP_URL in Code.gs."
          fi

          if [[ -z "$CLASPRC_JSON" ]]; then
            echo "::error::Missing GitHub Actions secret CLASPRC_JSON. Add the clasp authentication JSON as a repository Actions secret."
          fi

          if [[ -n "$CLASPRC_JSON" && -n "$DEPLOY_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apps Script deployment was skipped because required credentials are missing."
          fi

      - name: Install clasp
        if: steps.config.outputs.ready == 'true'
        run: npm install --global @google/clasp

      - name: Authenticate clasp
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          install -d "$HOME"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Push source to Apps Script
        if: steps.config.outputs.ready == 'true'
        run: clasp push --force

      - name: Update existing web app deployment
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          clasp deploy --deploymentId "$GAS_DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA}"
